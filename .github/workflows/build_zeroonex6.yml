name: Build ZeroOneX6 Firmware

on:
  push:
    paths-ignore:
      # ignore SITL-only HALs
      - 'libraries/AP_HAL_Linux/**'
      - 'libraries/AP_HAL_ESP32/**'
      - 'libraries/AP_HAL_SITL/**'
      # ignore autotest scripts
      - 'Tools/autotest/**'
      # ignore documentation
      - '**.md'
      # ignore dotfiles / CI-unrelated configs
      - './.dir-locals.el'
      - './.dockerignore'
      - './.editorconfig'
      - './.flake8'
      - './.gitattributes'
      - './.gitignore'
      - './.pre-commit-config.yaml'
      - './.pydevproject'
      - './.valgrind-suppressions'
      - './.valgrindrc'
      - 'Dockerfile'
      - 'Vagrantfile'
      - 'Makefile'
      - '.vscode/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/test_environment.yml'

  pull_request:
    paths-ignore:
      - 'libraries/AP_HAL_Linux/**'
      - 'libraries/AP_HAL_ESP32/**'
      - 'libraries/AP_HAL_SITL/**'
      - 'Tools/autotest/**'
      - '**.md'
      - './.dir-locals.el'
      - './.dockerignore'
      - './.editorconfig'
      - './.flake8'
      - './.gitattributes'
      - './.gitignore'
      - './.pre-commit-config.yaml'
      - './.pydevproject'
      - './.valgrind-suppressions'
      - './.valgrindrc'
      - 'Dockerfile'
      - 'Vagrantfile'
      - 'Makefile'
      - '.vscode/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/test_environment.yml'

  workflow_dispatch:

concurrency:
  group: ci-${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ardupilot/ardupilot-dev-chibios:v0.1.3
    strategy:
      fail-fast: false
      matrix:
        board:
          - ZeroOneX6
          - ZeroOneX6_Air

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        run: |
          NOW=$(date -u +"%F-%T")
          echo "timestamp=${NOW}" >> $GITHUB_OUTPUT

      - name: ccache cache files
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ${{github.workflow}}-ccache-${{matrix.board}}-${{steps.ccache_cache_timestamp.outputs.timestamp}}
          restore-keys: ${{github.workflow}}-ccache-${{matrix.board}}-

      - name: setup ccache
        run: |
          . .github/workflows/ccache.env

      - name: Configure ${{matrix.board}}
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          PATH="/usr/lib/ccache:/opt/gcc-arm-none-eabi-10/bin:$PATH"
          PATH="/github/home/.local/bin:$PATH"
          ./waf configure --board ${{matrix.board}}

      - name: Build all vehicles for ${{matrix.board}}
        run: |
          PATH="/usr/lib/ccache:/opt/gcc-arm-none-eabi-10/bin:$PATH"
          PATH="/github/home/.local/bin:$PATH"
          ./waf copter
          ./waf plane
          ./waf rover
          ./waf sub
          ./waf antennatracker
          ccache -s
          ccache -z

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.board}}-firmware
          path: build/${{matrix.board}}/bin/
          retention-days: 30
